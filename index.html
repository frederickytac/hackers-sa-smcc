```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Swimming Invitation 🌊</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;

            background: linear-gradient(
                135deg,
                #00c6ff,
                #0072ff
            );
        }

        /* BUBBLES */

        .bubbles span {
            position: fixed;
            bottom: -50px;

            width: 25px;
            height: 25px;

            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 50%;

            animation: bubble 8s linear infinite;
        }

        .bubbles span:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
        }

        .bubbles span:nth-child(2) {
            left: 25%;
            width: 15px;
            height: 15px;
            animation-delay: 2s;
        }

        .bubbles span:nth-child(3) {
            left: 45%;
            width: 35px;
            height: 35px;
            animation-delay: 4s;
        }

        .bubbles span:nth-child(4) {
            left: 65%;
            animation-delay: 1s;
        }

        .bubbles span:nth-child(5) {
            left: 80%;
            width: 18px;
            height: 18px;
            animation-delay: 3s;
        }

        .bubbles span:nth-child(6) {
            left: 90%;
            width: 30px;
            height: 30px;
            animation-delay: 5s;
        }

        @keyframes bubble {
            0% {
                transform: translateY(0);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }

        /* CARD */

        .card {
            position: relative;
            z-index: 5;

            width: 100%;
            max-width: 520px;

            padding: 35px 25px;

            background: rgba(255,255,255,0.96);

            border-radius: 30px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.3);

            animation: appear 0.8s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .icon {
            font-size: 60px;

            animation: swim 2s infinite;
        }

        @keyframes swim {
            0%,100% {
                transform: rotate(-5deg);
            }

            50% {
                transform: rotate(5deg);
            }
        }

        h1 {
            color: #0077b6;
            font-size: 42px;
            margin-top: 10px;
        }

        h2 {
            color: #023e8a;
            margin-top: 8px;
        }

        .intro {
            margin: 18px 0;
            color: #555;
            line-height: 1.6;
            font-size: 17px;
        }

        /* DETAILS */

        .details {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
        }

        .detail {
            display: flex;
            align-items: center;

            text-align: left;

            padding: 15px;

            background: #e9f9ff;

            border-left: 5px solid #00a8e8;

            border-radius: 15px;

            transition: 0.3s;
        }

        .detail:hover {
            transform: translateX(5px);
            background: #d7f5ff;
        }

        .detail-icon {
            font-size: 30px;
            width: 55px;
        }

        .detail small {
            display: block;
            color: #777;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .detail strong {
            color: #0077b6;
            font-size: 17px;
        }

        .message {
            color: #444;
            line-height: 1.6;
            margin: 20px 0;
        }

        /* BUTTONS */

        .buttons {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;

            margin-top: 20px;
        }

        button {
            border: none;

            padding: 15px 10px;

            border-radius: 15px;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-4px) scale(1.03);

            box-shadow:
                0 8px 18px rgba(0,0,0,0.2);
        }

        button:active {
            transform: scale(0.95);
        }

        .yes {
            background: #2ecc71;
        }

        .no {
            background: #e74c3c;
        }

        .maybe {
            background: #f39c12;
        }

        .tara {
            background: #0077b6;

            grid-column: span 2;
        }

        /* RESPONSE */

        #response {
            min-height: 30px;

            margin-top: 20px;

            color: #0077b6;

            font-size: 18px;

            font-weight: bold;

            line-height: 1.5;
        }

        /* FOOTER */

        footer {
            margin-top: 25px;

            color: #777;

            font-size: 14px;
        }

        /* MOBILE */

        @media (max-width: 450px) {

            .card {
                padding: 30px 18px;
            }

            h1 {
                font-size: 34px;
            }

            h2 {
                font-size: 20px;
            }

            .buttons {
                grid-template-columns: 1fr;
            }

            .tara {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

    <!-- ANIMATED BUBBLES -->

    <div class="bubbles">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>


    <!-- INVITATION -->

    <div class="card">

        <div class="icon">
            🏊‍♂️🌊
        </div>

        <h1>You're Invited!</h1>

        <h2>Outdoor Swimming 🌴☀️</h2>

        <p class="intro">
            Hey friends! 👋<br>
            Let's escape the heat and have some
            fun together!
        </p>


        <!-- DETAILS -->

        <div class="details">

            <div class="detail">

                <div class="detail-icon">
                    📍
                </div>

                <div>
                    <small>PLACE</small>

                    <strong>
                        Busay sa Macalang
                    </strong>
                </div>

            </div>


            <div class="detail">

                <div class="detail-icon">
                    📅
                </div>

                <div>
                    <small>DATE</small>

                    <strong>
                        Later
                    </strong>
                </div>

            </div>


            <div class="detail">

                <div class="detail-icon">
                    ⏰
                </div>

                <div>
                    <small>TIME</small>

                    <strong>
                        4:00 PM
                    </strong>
                </div>

            </div>

        </div>


        <p class="message">
            Bring your swimming clothes, towel,
            snacks, and your best vibes! 😎🌊
        </p>


        <!-- CHOICES -->

        <div class="buttons">

            <button
                class="yes"
                onclick="chooseAnswer('yes')">

                YES! 🏊

            </button>


            <button
                class="no"
                onclick="chooseAnswer('no')">

                NO 😢

            </button>


            <button
                class="maybe"
                onclick="chooseAnswer('maybe')">

                50/50 🤔

            </button>


            <button
                class="tara"
                onclick="chooseAnswer('tara')">

                TARA NA! 🔥

            </button>

        </div>


        <!-- RESPONSE -->

        <p id="response"></p>


        <footer>
            💦 Friends • Fun • Memories 💦
        </footer>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        function chooseAnswer(answer) {

            const response =
                document.getElementById("response");

            if (answer === "yes") {

                response.innerHTML =
                    "🎉 YEYYYY! Kita-kits sa Busay sa Macalang! 🏊‍♂️🌊";

            }

            else if (answer === "no") {

                response.innerHTML =
                    "😢 Sayang! Next time nalang. Enjoy mi! 😂";

            }

            else if (answer === "maybe") {

                response.innerHTML =
                    "🤔 50/50 pa? Tara na uy! Basin magbago pa isip mo! 😂🌊";

            }

            else if (answer === "tara") {

                response.innerHTML =
                    "🔥 TARA NA! Handa na ang swimming! 🏊‍♂️🌴☀️";

            }

        }

    </script>

</body>
</html>
```
